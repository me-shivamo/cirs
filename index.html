<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#fbfaf7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CIRS Videos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="app-icons/icon-192.png">
<link rel="apple-touch-icon" href="app-icons/icon-192.png">
<link rel="stylesheet" href="css/font.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Home screen: design 4a, drawn at 1920x1080 and scaled to fit the screen -->
<main id="stage" class="stage">
  <header class="head">
    <div class="head-text">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 class="headline" id="headline"></h1>
    </div>
    <div class="tagline" id="tagline"></div>
  </header>
  <div class="grid" id="grid"></div>
</main>

<!-- Video player (also used for the idle showreel) -->
<section id="player" class="player" aria-hidden="true">
  <video id="video" playsinline webkit-playsinline disablepictureinpicture disableremoteplayback
         controlslist="nodownload nofullscreen noremoteplayback" preload="auto"></video>
  <div class="tap-layer" id="tapLayer"></div>
  <button class="home-btn" id="homeBtn" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Home</span>
  </button>
  <div class="title-chip" id="titleChip"></div>
  <div class="big-play" id="bigPlay" aria-hidden="true"></div>
  <button class="sound-chip" id="soundChip" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>Tap for sound</span>
  </button>
  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  <div class="attract-banner">
    <div class="attract-pill">
      <span class="tap-ring" aria-hidden="true"></span>
      <span class="attract-big">Touch the screen to explore</span>
    </div>
    <div class="attract-now" id="attractNow"></div>
  </div>
</section>

<!-- Setup screen (hosted link): save the videos on this device -->
<section id="setup" class="screen scroll" hidden>
  <div class="screen-inner">
    <div class="eyebrow">CCMTEC · SCREEN SETUP</div>
    <h1 class="screen-title">Set up this screen</h1>
    <p class="screen-lead">The videos are saved on this screen, so they play without internet.</p>

    <div class="card">
      <div class="step-no">1</div>
      <div class="card-body">
        <h2 id="setupTitle">Save the videos</h2>
        <p class="status" id="setupStatus"></p>
        <div class="bar" id="setupBar" hidden><div class="bar-fill" id="setupBarFill"></div></div>
        <p class="sub" id="setupDetail"></p>
        <div class="btn-row">
          <button class="btn btn-primary" id="setupDownload" type="button">Download videos</button>
          <button class="btn btn-outline" id="setupUsb" type="button">Load from USB stick</button>
          <button class="btn btn-ghost" id="setupStop" type="button" hidden>Stop</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="step-no">2</div>
      <div class="card-body">
        <h2>Start</h2>
        <p class="sub" id="startNote"></p>
        <div class="btn-row">
          <button class="btn btn-navy btn-big" id="setupStart" type="button">Start</button>
          <button class="btn btn-outline" id="setupInstall" type="button" hidden>Add to Home screen</button>
        </div>
      </div>
    </div>

    <p class="foot" id="setupFoot"></p>
  </div>
</section>

<!-- Staff screen: status, self-test and fixes -->
<section id="staff" class="screen scroll" hidden>
  <div class="screen-inner wide">
    <div class="staff-head">
      <div>
        <div class="eyebrow">CCMTEC · STAFF</div>
        <h1 class="screen-title">Staff options</h1>
      </div>
      <button class="btn btn-navy" id="staffClose" type="button">Close</button>
    </div>
    <div class="stat-grid" id="staffStats"></div>

    <div class="card flat">
      <div class="card-body">
        <h2>Check and fix</h2>
        <div class="btn-row">
          <button class="btn btn-primary" id="staffTest" type="button">Run self-test</button>
          <button class="btn btn-outline" id="staffDownload" type="button">Download / repair videos</button>
          <button class="btn btn-outline" id="staffUsb" type="button">Load from USB stick</button>
          <button class="btn btn-outline" id="staffUpdate" type="button">Check for updates</button>
          <button class="btn btn-outline" id="staffReload" type="button">Restart app</button>
        </div>
        <p class="sub" id="staffMsg"></p>
      </div>
    </div>

    <div class="card flat">
      <div class="card-body settings">
        <div class="setting"><span>Video quality</span><div class="seg" id="segQuality">
          <button type="button" data-v="auto">Auto</button><button type="button" data-v="hd">HD</button><button type="button" data-v="lite">Lite</button></div></div>
        <div class="setting"><span>Mode</span><div class="seg" id="segMode">
          <button type="button" data-v="interactive">Interactive</button><button type="button" data-v="loop">Loop only (no touch)</button></div></div>
        <div class="setting"><span>Volume</span><input type="range" id="volume" min="0" max="100" step="5"></div>
      </div>
    </div>

    <div class="card flat">
      <div class="card-body">
        <h2>Videos on this screen</h2>
        <table class="topic-table" id="topicTable"></table>
        <div class="btn-row"><button class="btn btn-danger" id="staffClear" type="button">Delete saved videos</button></div>
      </div>
    </div>
  </div>
</section>

<!-- PIN pad and confirm dialogs -->
<div id="modal" class="modal" hidden>
  <div class="modal-box" id="modalBox"></div>
</div>

<input type="file" id="fileInput" accept="video/mp4,.mp4" multiple hidden>
<div id="toast" class="toast" role="status"></div>
<div id="soakInfo" class="soak-info" hidden></div>

<script src="js/config.js"></script>
<script src="js/media.js"></script>
<script src="js/offline.js"></script>
<script src="js/app.js"></script>
<script src="js/setup.js"></script>
<script src="js/staff.js"></script>
</body>
</html>
