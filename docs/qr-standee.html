<!DOCTYPE html>
<!-- Printable A4 standee: visitors scan to watch the 19 videos on their own phones (?visitor link). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>CIRS – Watch on your phone</title>
<link rel="stylesheet" href="../css/font.css">
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Baloo 2', sans-serif; color: #1b2a78; }
  .page { width: 210mm; height: 297mm; padding: 20mm 18mm; background: #fbfaf7; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8mm; }
  .eyebrow { font-weight: 700; font-size: 14pt; letter-spacing: .12em; color: #4a5578; }
  h1 { margin: 0; font-weight: 800; font-size: 46pt; line-height: 1; }
  .tag { font-weight: 700; font-size: 22pt; color: #f08a1c; }
  .qr { width: 90mm; height: 90mm; padding: 6mm; background: #fff; border-radius: 8mm; box-shadow: 0 10mm 16mm -10mm rgba(20,30,90,.45); }
  .qr svg { width: 100%; height: 100%; }
  .url { font-weight: 700; font-size: 15pt; color: #4a5578; }
  .icons { display: flex; flex-wrap: wrap; justify-content: center; gap: 2.6mm; width: 100%; margin-top: auto; }
  .icons img { width: 15mm; height: 15mm; border-radius: 50%; }
  p { margin: 0; font-weight: 500; font-size: 15pt; color: #4a5578; }
</style>
</head>
<body>
<div class="page">
  <div class="eyebrow">CCMTEC</div>
  <h1>Watch on your phone</h1>
  <div class="tag">19 short videos · scan the code</div>
  <div class="qr" id="qr"></div>
  <div class="url" id="url"></div>
  <p>Open your phone camera, point it at the code and tap the link.</p>
  <div class="icons" id="icons"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
  var link = new URLSearchParams(location.search).get('url') || 'https://cirs-booth.pages.dev/?visitor';
  document.getElementById('url').textContent = link.replace(/^https?:\/\//, '');
  var qr = qrcode(0, 'M');
  qr.addData(link);
  qr.make();
  document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  var html = '';
  ['19', '01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12', '13', '14', '15', '16', '17', '18'].forEach(function (n) {
    html += '<img src="../assets/icons/' + n + '.webp" alt="">';
  });
  document.getElementById('icons').innerHTML = html;
</script>
</body>
</html>
